[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=9ED1078F4B1431F28DD788B188C72B46
ProjectName=Slinky

[/Script/Engine.AssetManagerSettings]
; bIsEditorOnly=True is deliberate, not a typo: the GameFeatures module this satisfies a cook-time
; check for is only ever loaded in the Editor context cooking runs in (this project enables no
; GameFeatures plugin content of its own) - the packaged GAME binary has no such module compiled
; in at all. Shipping this as bIsEditorOnly=False made the AssetManager try to resolve
; /Script/GameFeatures.GameFeatureData at actual runtime, which doesn't exist there: the ensure
; this caused made the packaged .exe hang at startup on a permanently black window - never crashed,
; never recovered, just stuck in UAssetManager::StartInitialLoading() before the title level ever
; got a chance to load.
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Features")),Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

; Both levels are only ever reached at runtime via UGameplayStatics::OpenLevel(FName) string/name
; references (USlinkyGameInstance::GoToTitle/GoToGame) - the cooker's static reference analysis
; can't see those, so without an explicit entry here a packaged build cooks whichever map happens
; to be the default (Lvl_Title) and silently omits the other. Confirmed via UnrealPak -list against
; an actual package: only Lvl_Title.umap was present, which is exactly why "はじめから" produced no
; transition in the packaged build - Lvl_Slinky.umap simply didn't exist in the pak to open.
[/Script/UnrealEd.ProjectPackagingSettings]
+MapsToCook=(FilePath="/Game/Slinky/Lvl_Title")
+MapsToCook=(FilePath="/Game/Slinky/Lvl_Slinky")

[ConsoleVariables]
CommonUI.CheckKeyboardFocusAndParentage=1
CommonUI.DisallowUserFocusedWidgetForPendingFocusRecipient=1
CommonUI.FallbackToDesiredOnAutoRestoreFailure=1
